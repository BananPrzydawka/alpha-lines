[package]
name = "alpha_lines_game"
version = "0.1.0"
edition = "2021"
description = "The alpha-lines game: one board, scored incrementally"

# Deliberately zero dependencies: the engine is one self-contained file and must build and
# run identically anywhere, without a crates.io fetch.
[dependencies]

[profile.release]
opt-level = 3
lto = true
codegen-units = 1

[profile.bench]
opt-level = 3
lto = true
codegen-units = 1
