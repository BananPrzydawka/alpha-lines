[package]
name = "alpha_lines_game"
version = "0.1.0"
edition = "2021"
description = "The alpha-lines game: one board, scored incrementally"

[lib]
crate-type = ["rlib", "cdylib"]

# The core needs no external crates.
[dependencies]

# Read the shared config at build time; the engine has no runtime dependencies.
[build-dependencies]
serde_json = "1"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
